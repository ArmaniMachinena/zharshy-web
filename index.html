<style>
:root{
  --sky:#0094b3; --sky-d:#006f87; --sky-l:#e3f5f9;
  --gold:#e8a900; --gold-l:#fff4d1;
  --ink:#14232b; --muted:#5d7079; --line:#dde7ea; --bg:#f5f8f9; --card:#fff;
  --red:#d6453d; --green:#1f9d63; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:var(--sky-d)}
/* header */
header{background:linear-gradient(120deg,var(--sky-d),var(--sky));color:#fff;padding:7px 20px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-60px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,169,0,.55) 0 22%,transparent 23%),repeating-conic-gradient(rgba(232,169,0,.35) 0 4deg,transparent 4deg 12deg);opacity:.5;pointer-events:none}
.hwrap{max-width:1560px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{flex:none}
.logo b{font-size:19px;letter-spacing:.06em;font-weight:800}
.logo small{font-size:12.5px;opacity:.88;font-weight:500;letter-spacing:0;margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.35)}
.logo>div{display:flex;align-items:center}
.hright{margin-left:auto;display:flex;flex-direction:row-reverse;align-items:center;gap:10px}
.langs{display:inline-flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.langs button{border:0;background:none;color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:4px 9px;border-radius:999px;cursor:pointer;opacity:.8}
.langs button.on{background:#fff;color:var(--sky-d);opacity:1}
.hmeta{font-size:12.5px;opacity:.92;text-align:right;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hmeta .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7dffb5;margin-right:5px;box-shadow:0 0 0 3px rgba(125,255,181,.25)}
.hbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:4px 11px;cursor:pointer;font-size:12.5px;font-weight:600}
.src-btn b{background:#fff;color:var(--sky-d);border-radius:999px;padding:0 6px;margin-left:2px;font-size:11.5px}
.hbtn.ico{width:28px;height:26px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
@media (min-width:761px){.hwrap{flex-wrap:nowrap}.hright{flex-direction:row-reverse}}
@media (max-width:1300px){.logo small{display:none}}
.todaychip{background:#fff;color:var(--sky-d);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px;white-space:nowrap}
.todaychip b{color:var(--red)}.todaychip i{font-style:normal}
@media (max-width:760px){.todaychip .cx{display:none}.todaychip{padding:3px 8px;font-size:12px}.hmeta{gap:5px}.hbtn{padding:3px 8px}.langs button{padding:4px 7px}.logo b{font-size:16px}.logo svg{width:24px;height:24px}
 .hwrap{flex-wrap:wrap!important;gap:6px}.hright{width:100%;margin-left:0;flex-direction:row-reverse;justify-content:space-between;flex-wrap:nowrap}.hmeta{flex-wrap:nowrap}
 .hmeta .dot{display:none}.hbtn{white-space:nowrap}.hbtn.ico{width:24px}.todaychip{font-size:11px;padding:3px 7px}.hmeta{gap:4px}.todaychip b{display:none}.src-btn b{margin-left:0}}
.hbtn:hover{background:rgba(255,255,255,.26)}
@media (max-width:760px){.logo small{display:none}.hmeta #upd{display:none}.hmeta .dot{margin:0}.hwrap{flex-wrap:nowrap}.src-btn [data-i]{display:none}}
/* layout */
main{max-width:1560px;margin:0 auto;padding:14px 20px 40px;display:grid;grid-template-columns:310px minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1250px){main{grid-template-columns:310px minmax(0,1fr)}.col.right{grid-column:1;grid-row:2}}
@media (max-width:900px){main{grid-template-columns:1fr;padding:14px 12px 40px}main>.col{display:contents}
  .p-alerts{order:1}.sponsor{order:1}.p-list{order:2}.p-strip{order:3}.p-stats{order:4}.p-map{order:5}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.ptitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 14px 0}
.ptitle h2{margin:0;font-size:17px}
.ptitle span{color:var(--muted);font-size:12.5px}
/* left */
.alerts{padding:16px}
.alerts h2{margin:0 0 2px;font-size:18px}
.alerts .sub{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.bucket{margin-top:14px}
.bucket h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bucket h3 .n{background:var(--sky-l);color:var(--sky-d);border-radius:999px;padding:1px 8px;font-size:12px}
.bucket.today h3{color:var(--red)} .bucket.today h3 .n{background:#fde8e6;color:var(--red)}
.bucket.tom h3{color:#b07a00} .bucket.tom h3 .n{background:var(--gold-l);color:#9a6a00}
.mini{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid transparent;border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:pointer}
.mini:hover{border-color:var(--sky)}
.mini .t{font-weight:700;font-size:14px;line-height:1.3}
.mini .m{color:var(--muted);font-size:12.5px;margin-top:2px}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
/* sponsor */
.sponsor{display:block;text-decoration:none;color:inherit;padding:12px 14px;position:relative;overflow:hidden;border:1px solid #f3dc95;background:linear-gradient(135deg,#fffaf0,#fff4d1)}
.sponsor .sl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a6000}
.sponsor .sb{display:flex;align-items:center;gap:12px;margin-top:8px;min-height:58px}
.sponsor img{max-height:58px;max-width:100%;object-fit:contain}
.sponsor .ph{flex:1;border:2px dashed #e7c76a;border-radius:10px;padding:10px;text-align:center;color:#8a6000;font-weight:700;font-size:13px}
.sponsor .ph small{display:block;font-weight:500;font-size:11.5px;margin-top:2px;color:#a07b1c}
.sponsor .sn{font-weight:800;font-size:16px}
.sponsor:hover{border-color:var(--gold)}
/* stats */
.stats{padding:12px 14px 14px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;background:#fff;min-width:0}
.kpi.hero{background:linear-gradient(135deg,var(--sky-d),var(--sky));color:#fff;border-color:transparent}
.kpi .v{font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
.kpi.hero .l{color:#dff6fb}
.kpi .fill{height:4px;border-radius:2px;background:var(--sky-l);margin-top:7px;overflow:hidden}
.kpi .fill i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .8s ease}
.kpi.hero .fill{background:rgba(255,255,255,.25)} .kpi.hero .fill i{background:#fff}
.facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:800}
.facts .new b{color:var(--green)}
/* narrow left map */
@media (min-width:901px){.left .clab{display:none}.left .city .lab{font-size:30px}.left .cdot{r:5}}
/* narrow right column */
@media (min-width:901px){
 .right .kpis{grid-template-columns:repeat(2,1fr)} .right .kpi.hero{grid-column:span 2}
 .right .kpi.hero .v{font-size:32px}
 .right .strip,.left .strip{grid-template-columns:repeat(6,1fr);gap:4px}
 .right .dcell{min-height:54px;padding:4px}
 .right .dcell .dn{font-size:15px}
 .right .bar{font-size:0;height:4px;padding:0;background:var(--sky)} .right .bar.more{font-size:9.5px;height:auto;background:none}
 .right .dcell.sel .bar{background:#fff} .right .dcell.sel .bar.more{background:none}
 .right .dcell .wd{font-size:9.5px}
}
@media (min-width:901px) and (max-width:1250px){.right .kpis{grid-template-columns:repeat(2,1fr)}}
/* sources */
.sgrp{margin-top:16px}
.sgrp h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sky-d)}
.sgrp h3 .n{background:var(--sky-l);border-radius:999px;padding:0 8px;font-size:12px}
.srow{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border-bottom:0}
.srow .dotc{width:10px;height:10px;border-radius:50%;background:#c5d0d4}
.srow .dotc.ok{background:var(--green);box-shadow:0 0 0 3px rgba(31,157,99,.15)} .srow .dotc.err{background:var(--red)} .srow .dotc.off{background:#c5d0d4} .srow .dotc.plan{background:var(--gold)}
.srow .nm{min-width:0} .srow .nm a{color:var(--ink);text-decoration:none;font-weight:600} .srow .nm a:hover{color:var(--sky-d)}
.srow .nm small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .rt{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.srow .rt b{color:var(--ink);font-size:13px}
.swarn{background:var(--gold-l);border:1px solid #f3dc95;color:#7a5400;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0 0}
.ssum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.ssum b{color:var(--ink)}
.kpi.past{background:var(--gold-l);border-color:#f3dc95;cursor:pointer;text-align:left;font:inherit;color:inherit;grid-column:1/-1}
.kpi.past .l{color:#8a6000}
.kpi.past:hover{border-color:var(--gold)}
/* compact stats */
@media (min-width:901px){.p-stats .ptitle [data-i=dbSub]{display:none}.p-stats .facts{font-size:12.5px;gap:4px 10px}}
@media (min-width:901px){
 .right .kpis{grid-template-columns:repeat(5,1fr);gap:5px}
 .right .kpi{padding:6px 4px 5px;border-radius:9px;text-align:center}
 .right .kpi .v{font-size:17px}
 .right .kpi .l{font-size:8.5px;letter-spacing:0;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .right .kpi .fill{height:3px;margin-top:4px}
 .right .kpi.hero{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;padding:8px 12px;text-align:left}
 .right .kpi.hero .v{font-size:24px}
 .right .kpi.hero .l{font-size:11px;margin:0;flex:1}
 .right .kpi.hero .fill{display:none}
 .right .kpi.past{display:flex;align-items:baseline;gap:8px;padding:6px 12px;text-align:left}
 .right .kpi.past .v{font-size:18px}
 .right .kpi.past .l{font-size:10.5px;margin:0}
 .right .kpi.past .l+.l{margin-left:auto}
}
/* prefs */
.pref-btn{background:linear-gradient(135deg,#fff4d1,#fff);border-color:#f3dc95;color:#7a5400}
.reco{border:1px solid #f3dc95;background:linear-gradient(135deg,#fffaf0,#fff);border-radius:12px;padding:12px 14px;margin:6px 0 10px}
.reco.empty{display:flex;gap:12px;align-items:center;justify-content:space-between}
.reco.empty span{color:var(--muted);font-size:13px}
.reco .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.reco .rchips i{font-style:normal;font-size:11.5px;font-weight:700;background:var(--gold-l);color:#8a6000;border-radius:999px;padding:1px 8px;margin-right:4px}
.reco .rsub{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 4px}
.ritem{display:grid;grid-template-columns:110px 1fr auto;gap:10px;width:100%;text-align:left;border:0;background:#fff;border-radius:8px;padding:7px 9px;margin-bottom:4px;cursor:pointer;font-size:14px;align-items:center;border:1px solid var(--line)}
.ritem:hover{border-color:var(--gold)}
.ritem .rd{color:var(--sky-d);font-weight:800;font-size:12.5px}.ritem .rt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ritem .rc{color:var(--muted);font-size:12.5px;white-space:nowrap}
@media (max-width:640px){.ritem{grid-template-columns:1fr}.ritem .rt{white-space:normal}.reco.empty{flex-direction:column;align-items:flex-start}}
.tag.foryou{background:var(--gold-l);color:#8a6000;border-color:#f3dc95}
.pgrid{display:flex;flex-wrap:wrap;gap:6px}
.pchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;background:#fff}
.pchk input{accent-color:var(--sky)}
.pchk:has(input:checked){background:var(--sky-l);border-color:var(--sky);color:var(--sky-d);font-weight:700}
.ph3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sky-d);margin:14px 0 6px}
/* submit */
.hbtn.addb{background:var(--gold);border-color:var(--gold);color:#3b2a00;font-weight:800}
.addf{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.addf label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted)}
.addf .w2{grid-column:1/-1}
.addf input,.addf select,.addf textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);font-weight:500;background:#fff}
.addf .chk{flex-direction:row;align-items:flex-start;gap:8px;font-weight:600}
.addf .chk input{margin-top:2px}
.merr{background:#fde8e6;color:#9b2c25;border-radius:8px;padding:8px 10px;font-size:13px}
.mok{background:#e9f8ee;color:#1d7b4a;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.mwarn{background:var(--gold-l);color:#7a5400;border-radius:8px;padding:8px 10px;font-size:13px}
.modnote{margin-top:14px;background:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px}
.modnote ol{padding-left:18px;margin:6px 0 0}.modnote li{margin-bottom:4px}
@media (max-width:640px){.addf{grid-template-columns:1fr}}
@media (max-width:760px){#addBtn [data-i],#anBtn [data-i]{display:none}}
/* features */
.toolsb{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.tbtn:hover{border-color:var(--sky)}
.tag.abroad{background:#fff1e6;color:#a4520c;border-color:#f7d6bb}
.tag.feat{background:var(--gold);color:#fff;border-color:var(--gold)}
.ev.featured{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-l)}
.spk{margin:12px 0 4px} .spk h3{font-size:14px;margin:0 0 6px}
.spk li{font-size:14px;margin-bottom:3px} .spk li small{color:var(--muted)}
.urlbox{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;background:var(--bg)}
.an{margin-top:14px}.an h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--sky-d);margin:0 0 6px}
.anr{display:grid;grid-template-columns:150px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin-bottom:4px}
.anr .k{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.anr .b{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.anr .b i{display:block;height:100%;background:var(--sky);border-radius:5px}
.anr b{text-align:right}
.an2{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media (max-width:640px){.an2{grid-template-columns:1fr}.anr{grid-template-columns:110px 1fr 30px}}
.sheet.wide{max-width:860px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:80;transition:transform .25s;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#aiFab{position:fixed;right:18px;bottom:18px;z-index:40;border:0;border-radius:999px;padding:12px 18px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--sky-d),var(--sky));box-shadow:0 6px 20px rgba(0,111,135,.35);cursor:pointer}
#ai{position:fixed;right:18px;bottom:76px;width:min(420px,calc(100vw - 24px));height:min(560px,calc(100vh - 120px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(10,25,32,.25);z-index:45;display:flex;flex-direction:column}
#ai[hidden]{display:none}
#ai header{all:unset;display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800}
#ai header button{margin-left:auto;border:0;background:var(--bg);border-radius:50%;width:30px;height:30px;cursor:pointer}
#aiLog{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.aim{max-width:88%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45}
.aim.user{align-self:flex-end;background:var(--sky);color:#fff}
.aim.assistant{align-self:flex-start;background:var(--bg)}
.aiev{border:0;background:var(--sky-l);color:var(--sky-d);border-radius:6px;padding:1px 6px;font-weight:700;cursor:pointer;font-size:13px}
#aiF{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
#aiIn{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
#aiF button{border:0;background:var(--sky);color:#fff;border-radius:10px;padding:0 14px;font-weight:800;cursor:pointer}
.aisug{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.aisug button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
/* 30 days */
.strip{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;padding:12px 14px 14px}
@media (max-width:1100px){.strip{grid-template-columns:repeat(7,1fr)}}
@media (max-width:560px){.strip{grid-template-columns:repeat(5,1fr)}}
.dcell{border:1px solid var(--line);border-radius:9px;background:#fff;padding:5px 5px 6px;text-align:left;cursor:pointer;min-height:76px;display:flex;flex-direction:column;gap:3px;min-width:0}
.dcell:hover{border-color:var(--sky)}
.dcell .wd{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.dcell .wd.we{color:#b5534d}
.dcell .dn{font-size:18px;font-weight:800;line-height:1}
.dcell .mo{font-size:10px;font-weight:700;color:var(--sky-d);text-transform:uppercase}
.dcell.has{background:var(--sky-l);border-color:#bfe5ee}
.dcell.now{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.dcell.sel{background:var(--sky);border-color:var(--sky);color:#fff}
.dcell.sel .wd,.dcell.sel .mo{color:#e8fbff}
.bars{display:flex;flex-direction:column;gap:2px;margin-top:auto}
.bar{font-size:10px;font-weight:700;line-height:1.25;border-radius:3px;padding:1px 4px;background:#fff;color:var(--sky-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcell.sel .bar{background:rgba(255,255,255,.9)}
.bar.more{background:none;color:var(--muted);padding:0 2px}
.dcell.sel .bar.more{color:#fff}
@media (max-width:560px){.bar{font-size:0;height:5px;padding:0;background:var(--sky)}.bar.more{font-size:10px;height:auto;background:none}.dcell.sel .bar{background:#fff}.dcell.sel .bar.more{background:none}}
/* map */
.mapwrap{padding:6px 10px 12px;position:relative}
.mapwrap svg{width:100%;height:auto;display:block}

  about:`<h2>Жаршы — как это работает</h2>
  <p>В старину жаршы объезжал аулы и объявлял людям важные вести. Здесь его работу делает паук: каждый час он проверяет Telegram-каналы и заявки, а каждые 3 часа обходит все сайты выставочных компаний, госорганов и агрегаторов. ИИ вытаскивает название, даты, город, уровень, организатора и контакты — сразу на трёх языках. Дубликаты склеиваются, прошедшие события уходят в архив.</p>
  <h3>Зачем это нужно</h3>
  <p>Жаршы вырос из 7,5 лет работы по развитию деловых площадок Казахстана и опыта проведения более 1 500 мероприятий. Этот опыт показал: анонсы форумов, выставок, конференций и вебинаров разбросаны по сотням сайтов, Telegram-каналов и чатов. Собирать их вручную долго и дорого, а нужное событие часто находишь, когда оно уже прошло. Отсюда идея — сделать то же самое современнее, гибче и в цифровом формате.</p>
  <h3>Почему это делает робот</h3><ul>
  <li><b>Без человеческого фактора.</b> Не забывает, не устаёт, не выбирает «своих» — одни правила для всех организаторов.</li>
  <li><b>Охват.</b> Каждый час проверяет сотни источников, склеивает дубли и сразу переводит на три языка.</li>
  <li><b>Скорость.</b> Новый анонс попадает в календарь в течение часа, а не когда до него дойдут руки.</li>
  <li><b>Прозрачность.</b> Заявки проходят одинаковую автоматическую проверку, платные размещения всегда помечены.</li></ul>
  <h3>Для кого</h3><ul>
  <li><b>Для каждого.</b> Бесплатно — свой календарь нужных событий, чтобы встретиться с нужными людьми, всё спланировать и быть эффективным.</li>
  <li><b>Для ассоциаций и госсектора.</b> Полная картина отраслевой и государственной повестки, без накладок дат.</li>
  <li><b>Для бизнеса, корпораций, поставщиков и подрядчиков.</b> Где искать клиентов и партнёров, где выступать и что посетить.</li>
  <li><b>Прежде всего — для организаторов.</b> В Казахстане немного организаторов выставок и конференций, и свои события они проводят на высоком уровне. Жаршы помогает, чтобы эти залы были полны посетителей, участников, экспонентов и партнёров.</li></ul>
  <div class="fbcta"><button class="btn pri" data-feedback>✉ Предложить сотрудничество</button><span>Коллаборация, реклама, покупка или идея — напишите нам</span></div>
  <h3>Этапы</h3><ol>
  <li><b>Сейчас.</b> Сайты и открытые Telegram-каналы. Дашборд, 30 дней, карта, фильтры, ☆ и добавление в календарь.</li>
  <li><b>Далее.</b> Telegram-бот: перешлите ему анонс или вебинар из любого чата (в том числе из WhatsApp) — он сам разберёт и добавит. Форма для организаторов.</li>

  about:`<h2>Жаршы — қалай жұмыс істейді</h2>
  <p>Ертеде жаршы ауыл аралап, елге маңызды хабарды жариялаған. Мұнда бұл жұмысты өрмекші-бағдарлама атқарады: сағат сайын Telegram-арналар мен өтінімдерді, ал әр 3 сағат сайын көрме компанияларының, мемлекеттік органдардың, агрегаторлардың сайттарын және ашық Telegram-арналарды аралайды, ал ЖИ атауын, күнін, қаласын, деңгейін, ұйымдастырушысы мен байланыстарын бірден үш тілде шығарады. Қайталанатын жазбалар біріктіріледі, өткен іс-шаралар мұрағатқа кетеді.</p>
  <h3>Бұл не үшін керек</h3>
  <p>Жаршы Қазақстанның іскерлік алаңдарын дамытудағы 7,5 жылдық жұмыс пен 1 500-ден астам іс-шара өткізу тәжірибесінен туды. Бұл тәжірибе көрсеткендей: форумдар, көрмелер, конференциялар мен вебинарлар туралы хабарландырулар жүздеген сайттарға, Telegram-арналар мен чаттарға шашырап жатыр. Оларды қолмен жинау ұзақ әрі қымбат, ал қажетті іс-шара көбіне өтіп кеткен соң табылады. Сондықтан идея — мұны заманауи, икемді, цифрлық форматта жасау.</p>
  <h3>Неге мұны робот жасайды</h3><ul>
  <li><b>Адам факторынсыз.</b> Ұмытпайды, шаршамайды, «өзімдікін» таңдамайды — барлық ұйымдастырушыға бірдей ереже.</li>
  <li><b>Қамту.</b> Сағат сайын жүздеген дереккөзді тексеріп, қайталанғанын біріктіреді және бірден үш тілге аударады.</li>
  <li><b>Жылдамдық.</b> Жаңа хабарландыру күнтізбеге бір сағат ішінде түседі.</li>
  <li><b>Ашықтық.</b> Өтінімдер бірдей автоматты тексеруден өтеді, ақылы орналастыру әрқашан белгіленеді.</li></ul>
  <h3>Кімге арналған</h3><ul>
  <li><b>Әркімге.</b> Тегін — қажетті іс-шаралардың жеке күнтізбесі: керекті адамдармен кездесіп, бәрін жоспарлап, тиімді болу үшін.</li>
  <li><b>Қауымдастықтар мен мемлекеттік секторға.</b> Салалық және мемлекеттік күн тәртібінің толық көрінісі, күндер қабаттаспайды.</li>
  <li><b>Бизнеске, корпорацияларға, жеткізушілер мен мердігерлерге.</b> Клиент пен серіктесті қайдан іздеу, қайда сөз сөйлеу, неге бару.</li>
  <li><b>Ең алдымен — ұйымдастырушыларға.</b> Қазақстанда көрме мен конференция ұйымдастырушылары аз, олар іс-шараларын жоғары деңгейде өткізеді. Жаршы бұл залдардың келушілер, қатысушылар, экспоненттер мен серіктестерге толы болуына көмектеседі.</li></ul>
  <div class="fbcta"><button class="btn pri" data-feedback>✉ Ынтымақтастық ұсыну</button><span>Серіктестік, жарнама, сатып алу немесе идея — бізге жазыңыз</span></div>
  <h3>Кезеңдер</h3><ol>
  <li><b>Қазір.</b> Сайттар мен ашық Telegram-арналар. Дашборд, 30 күн, карта, сүзгілер, ☆ және күнтізбеге қосу.</li>
  <li><b>Келесі.</b> Telegram-бот: кез келген чаттан (WhatsApp-тан да) хабарландыру не вебинарды жіберсеңіз — өзі талдап, қосады. Ұйымдастырушыларға арналған форма.</li>
  <li><b>Жеке кабинет.</b> Салалар мен қалалар бойынша жазылым, 7 күн / 1 күн / 1 сағат бұрын еске салу, таңғы шолу.</li>
  <li><b>Әлеуметтік желілер.</b> Facebook, Instagram, TikTok — ресми API және ұйымдастырушылармен серіктестік арқылы.</li></ol>`},

  <p>In the old steppe, the <i>zharshy</i> rode from village to village announcing important news. Here a crawler does that job: every hour it checks Telegram channels and submissions, and every 3 hours visits exhibition organizers, government sites, aggregators and public Telegram channels, and AI extracts the title, dates, city, level, organizer and contacts — in three languages at once. Duplicates are merged and past events move to the archive.</p>
  <h3>Why it matters</h3>
  <p>Zharshy grew out of 7.5 years of developing business venues in Kazakhstan and running more than 1,500 events. That experience showed that announcements of forums, exhibitions, conferences and webinars are scattered across hundreds of websites, Telegram channels and chats. Collecting them by hand is slow and expensive, and you often find the right event after it is over. Hence the idea: do it in a modern, flexible, digital way.</p>

  <li><b>Businesses, corporations, suppliers and contractors.</b> Where to find clients and partners, where to speak and what to attend.</li>

function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5)}

function fmtRange(e,noYear){
  if(e.date_approx==='month'){const s=dOf(e.start);return `${L().monF[s.getUTCMonth()]} ${s.getUTCFullYear()} · ${t('approx')}`}
  const s=dOf(e.start), en=dOf(endOf(e)), y=noYear?'':' '+en.getUTCFullYear();
  if(e.start===endOf(e)) return fmtDay(e.start,!noYear);
  if(s.getUTCMonth()===en.getUTCMonth()) return `${s.getUTCDate()}–${en.getUTCDate()} ${monName(s.getUTCMonth())}${y}`;
  return `${s.getUTCDate()} ${monName(s.getUTCMonth())} – ${en.getUTCDate()} ${monName(en.getUTCMonth())}${y}`;
}

const norm=s=>String(s||'').toLowerCase().replace(/[^a-zа-яёәіңғүұқөһ0-9]/gi,'');
/* ---------- мои интересы: персональные рекомендации ---------- */
let PREFS=store.get('zh-prefs',null);
const hasPrefs=()=>PREFS&&((PREFS.ind||[]).length||(PREFS.city||[]).length||(PREFS.type||[]).length);
function prefScore(e){
  if(!hasPrefs())return 0;
  if(isAbroad(e)&&PREFS.abroad===false)return 0;
  let s=0;const ind=PREFS.ind||[],ci=PREFS.city||[],ty=PREFS.type||[];
  if(ind.length&&(e.industries||[]).some(i=>ind.includes(i)))s+=3;
  if(ci.length&&ci.includes(e.city))s+=2;
  if(ty.length&&ty.includes(e.type))s+=1;
  if(PREFS.gov&&['official','visit','summit'].includes(e.type))s+=2;
  if(ind.length&&!(e.industries||[]).some(i=>ind.includes(i))&&!(PREFS.gov&&['official','visit','summit'].includes(e.type)))return 0;
  return s;
}
function recoBlock(){
  const td=todayISO();
  if(!hasPrefs())return '';
  if(0)return `<div class="reco empty"><div title="${esc(t('prefNudgeSub'))}"><b>✨ ${esc(t('prefNudge'))}</b> <span>${esc(t('prefNudgeSub'))}</span></div><button class="btn pri" data-prefs>${esc(t('prefSet'))}</button></div>`;
  const list=DATA.events.filter(e=>endOf(e)>=td&&prefScore(e)>0).sort((a,b)=>a.start.localeCompare(b.start));
  const kz=list.filter(e=>!isAbroad(e)).slice(0,4), ab=list.filter(isAbroad).slice(0,3);
  const chips=[...(PREFS.ind||[]).map(indName),...(PREFS.city||[]).map(cityName),...(PREFS.type||[]).map(x=>L().types[x]),...(PREFS.gov?[t('gov')]:[])].slice(0,8);
  const row=e=>`<button class="ritem" data-id="${esc(e.id)}"><span class="rd">${esc(fmtRange(e,true))}</span><span class="rt">${esc(fld(e,'title'))}</span><span class="rc">${isAbroad(e)?'🌍 ':''}${esc(cityName(e.city))}</span></button>`;
  return `<div class="reco"><div class="rh"><b>✨ ${esc(t('recoTitle'))}</b><span class="rchips">${chips.map(c=>`<i>${esc(c)}</i>`).join('')}</span><button class="linkb" data-prefs>${esc(t('prefEdit'))}</button></div>
    ${kz.length?`<div class="rsub">🇰🇿 ${esc(t('recoKz'))}</div>${kz.map(row).join('')}`:''}
    ${ab.length?`<div class="rsub">🌍 ${esc(t('recoAbroad'))}</div>${ab.map(row).join('')}`:''}
    ${!kz.length&&!ab.length?`<div class="empty">${esc(t('recoNone'))}</div>`:''}</div>`;
}
function openPrefs(){
  $('sheet').classList.remove('wide');$('sheet').dataset.ev='__prefs';
  const p=PREFS||{ind:[],city:[],type:[],abroad:true,gov:false};
  const chk=(name,val,label,on)=>`<label class="pchk"><input type="checkbox" name="${name}" value="${esc(val)}"${on?' checked':''}><span>${esc(label)}</span></label>`;
  const inds=Object.keys(IND), cities=['Астана','Алматы','Шымкент','Атырау','Актау','Караганда','Актобе','Павлодар','Усть-Каменогорск','Костанай','Уральск','Кызылорда','Тараз','Туркестан','Семей','Кокшетау','Петропавловск','Талдыкорган'];
  $('sheet').innerHTML=`<button class="x" data-close>×</button><h2>✨ ${esc(t('prefTitle'))}</h2><p class="src">${esc(t('prefSub'))}</p>
  <form id="prefF"><h3 class="ph3">${esc(t('f_ind'))}</h3><div class="pgrid">${inds.map(i=>chk('ind',i,indName(i),(p.ind||[]).includes(i))).join('')}</div>
  <h3 class="ph3">${esc(t('f_city'))}</h3><div class="pgrid">${cities.map(c=>chk('city',c,cityName(c),(p.city||[]).includes(c))).join('')}</div>
  <h3 class="ph3">${esc(t('x_type'))}</h3><div class="pgrid">${Object.entries(L().types).map(([k,v])=>chk('type',k,v,(p.type||[]).includes(k))).join('')}</div>
  <h3 class="ph3">${esc(t('prefMore'))}</h3><div class="pgrid">${chk('abroad','1',t('prefAbroad'),p.abroad!==false)}${chk('gov','1',t('prefGov'),!!p.gov)}</div>
  <div class="actions"><button class="btn pri" type="submit">${esc(t('prefSave'))}</button><button class="btn" type="button" data-prefclear>${esc(t('prefClear'))}</button></div></form>`;
  $('modal').classList.add('open');
  $('prefF').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);
    PREFS={ind:f.getAll('ind'),city:f.getAll('city'),type:f.getAll('type'),abroad:f.has('abroad'),gov:f.has('gov')};store.set('zh-prefs',PREFS);$('modal').classList.remove('open');render();toast(t('prefSaved'))});
}
/* ---------- события ---------- */
document.addEventListener('click',ev=>{
  const lg=ev.target.closest('[data-lang]'); if(lg){lang=lg.dataset.lang;store.set('zh-lang',lang);applyLang();return}
  const f=ev.target.closest('[data-fav]'); if(f){ev.stopPropagation();toggleFav(f.dataset.fav);return}
  if(ev.target.closest('[data-prefs]')){openPrefs();return}
  if(ev.target.closest('[data-prefclear]')){PREFS=null;store.set('zh-prefs',null);$('modal').classList.remove('open');render();return}
  const sp=ev.target.closest('[data-spk]'); if(sp){exportSpeakers(sp.dataset.spk);return}
  const sg=ev.target.closest('[data-aisug]'); if(sg){aiAsk(sg.textContent);return}
  const ic=ev.target.closest('[data-ics]'); if(ic){ics(DATA.events.find(e=>e.id===ic.dataset.ics));return}
  if(ev.target.closest('[data-close]')||ev.target.id==='modal'){$('modal').classList.remove('open');return}
  if(ev.target.closest('[data-clearday]')){selDay=null;render();return}
  const pb=ev.target.closest('[data-period]'); if(pb){$('fPeriod').value=pb.dataset.period;selDay=null;render();return}
  const dc=ev.target.closest('[data-day]'); if(dc){selDay=selDay===dc.dataset.day?null:dc.dataset.day;if(view!=='list')setView('list');render();return}
  const ct=ev.target.closest('[data-city]'); if(ct){const s=$('fCity');s.value=s.value===ct.dataset.city?'':ct.dataset.city;render();return}
  const n=ev.target.closest('[data-nav]'); if(n){const [y,m]=calMonth.split('-').map(Number);calMonth=new Date(Date.UTC(y,m-1+ +n.dataset.nav,1)).toISOString().slice(0,7);render();return}
  const it=ev.target.closest('[data-id]'); if(it){openEv(it.dataset.id)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open')});
['q','fCity','fInd','fLevel','fType','fPeriod','fGeo'].forEach(id=>$(id).addEventListener('input',render));
$('favOnly').onclick=()=>{favOnly=!favOnly;$('favOnly').classList.toggle('on',favOnly);render()};
$('vList').onclick=()=>{setView('list');render()};
$('vCal').onclick=()=>{setView('cal');render()};
$('aboutBtn').onclick=openAbout;
/* «Источники» скрыты из шапки: открываются по адресу …/#info */
const infoHash=()=>{if(location.hash.toLowerCase()==='#info'){openSources();try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}};window.addEventListener('hashchange',infoHash);setTimeout(infoHash,300);$('fbBtn').onclick=openFeedback;
document.addEventListener('click',e=>{if(e.target.closest('[data-feedback]'))openFeedback()});
$('srcBtn').onclick=openSources;
$('anBtn').onclick=openAnalytics;$('prefBtn').onclick=openPrefs;$('addBtn').onclick=openSubmit;$('expBtn').onclick=exportList;$('subBtn').onclick=openSubscribe;
$('aiFab').onclick=openAI;$('aiX').onclick=()=>{$('ai').hidden=true};
$('aiF').addEventListener('submit',e=>{e.preventDefault();aiAsk($('aiIn').value)});
load();
})();
